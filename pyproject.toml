[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cas"
version = "0.1.0"
description = "Community Attribute Service — harmonized access to global geospatial attribute datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CAS Contributors" },
]
keywords = ["geospatial", "attributes", "raster", "soil", "elevation", "land-cover", "hydrology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
stac = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
cas = "cas.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/cas"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests requiring network access (deselect with '-m not network')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true
