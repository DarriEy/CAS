name: Provider Health Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# contents: write   -> push daily snapshots to the orphan health-history branch
# issues:   write   -> open/update the regression issue
permissions:
  contents: write
  issues: write

jobs:
  reachability:
    runs-on: ubuntu-latest
    # Monitor, not a gate: a bad egress window from the runner can time out a
    # batch of slow third-party endpoints at once (all healthy when probed
    # directly). Never red CI for that — the step logs still show what failed.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,stac,climate]"

      - name: Endpoint reachability check
        # Serial re-probe (built into cas verify) clears load-induced timeouts;
        # --max-failures tolerates the odd endpoint that stays slow so a couple
        # of transient timeouts out of ~228 don't red the job. A real outage
        # (many endpoints) still exceeds the tolerance.
        run: cas verify --max-failures 3
        timeout-minutes: 5

  extract:
    # End-to-end extraction sweep: a real extract() per provider over a
    # coverage-derived test polygon (see cas.monitor.geometry_check). The run is
    # compared against the committed baseline (health/baseline.json).
    #
    # This is a MONITOR, not a gate: extracting from ~228 third-party servers
    # on a shared runner has an irreducible flaky tail (slow government WCS/soil
    # endpoints that are healthy when probed directly but time out under load,
    # an unpredictable handful each run). So the job is non-blocking — it never
    # reds CI. Instead, a *persistent* regression (a provider broken in both
    # this run and the previous one, via health-history/latest.json) opens or
    # updates the tracking issue. Transient single-run churn stays in the logs.
    # The honest-degraded and auth-gated providers are baked into the baseline,
    # so they stay quiet. (Code correctness is gated by ci.yml, not here.)
    runs-on: ubuntu-latest
    # Never red CI: the sweep can fail or time out wholesale in a bad egress
    # window. The job still archives its snapshot and files a persistence-gated
    # issue when it completes; a failed/timed-out run is just a missed sample.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,stac,climate]"

      - name: End-to-end extraction health check
        run: cas health --json snapshot.json | tee health-output.txt
        # Headroom for the serial re-check pass, which re-probes every slow
        # provider one at a time and can run long in a bad egress window.
        timeout-minutes: 30

      - name: Fetch previous snapshot (for persistence gating)
        id: prev
        run: |
          if git ls-remote --exit-code --heads origin health-history >/dev/null 2>&1 \
             && git fetch --depth 1 origin health-history >/dev/null 2>&1 \
             && git show FETCH_HEAD:latest.json > prev.json 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Previous snapshot fetched from health-history."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No previous snapshot — first run gates on baseline alone."
          fi

      - name: Compare against baseline
        id: compare
        run: |
          set +e
          if [ "${{ steps.prev.outputs.available }}" = "true" ]; then
            cas health-compare health/baseline.json snapshot.json --previous prev.json | tee compare.txt
          else
            cas health-compare health/baseline.json snapshot.json | tee compare.txt
          fi
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo "regressed=true" >> "$GITHUB_OUTPUT"
          else
            echo "regressed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-snapshot
          path: |
            snapshot.json
            compare.txt

      - name: Archive snapshot to health-history branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          tmp=$(mktemp -d)
          git clone "$REPO_URL" "$tmp"
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin health-history >/dev/null 2>&1; then
            git checkout health-history
          else
            git checkout --orphan health-history
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p snapshots
          cp "$GITHUB_WORKSPACE/snapshot.json" "snapshots/$DATE.json"
          cp "$GITHUB_WORKSPACE/snapshot.json" latest.json
          git add -A
          git commit -m "Health snapshot $DATE" || { echo "No change since last snapshot."; exit 0; }
          git push origin health-history

      - name: Open or update regression issue
        if: steps.compare.outputs.regressed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('compare.txt', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              `Persistent provider health regression detected on **${date}** by \`provider-health.yml\` `,
              `(broken in two consecutive runs — not a transient blip).`,
              '',
              '```',
              report.trim(),
              '```',
              '',
              `[View run](${runUrl})`,
              '',
              'If a change is intentional/expected, refresh `health/baseline.json` and close this issue.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'health-regression',
            });
            if (existing.data.length) {
              const num = existing.data[0].number;
              await github.rest.issues.update({ owner, repo, issue_number: num, body });
              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: `Regression still present as of ${date}. [Run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `⚠ Provider health regression (${date})`,
                body,
                labels: ['health-regression'],
              });
            }

      - name: Flag persistent regression (non-blocking)
        if: steps.compare.outputs.regressed == 'true'
        run: |
          echo "::warning::Persistent provider health regression vs baseline — see the tracking issue. (Monitor only; not failing CI.)"
