name: Provider Health Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  reachability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,stac]"

      - name: Endpoint reachability check
        run: cas verify
        timeout-minutes: 2

  extract:
    # End-to-end extraction sweep: a real extract() per provider over a
    # coverage-derived test polygon (see cas.monitor.test_geometry).
    # Informational — does not hard-fail on individual flaky upstreams; the
    # summary line reports the healthy/degraded/down counts.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,stac]"

      - name: End-to-end extraction health check
        run: cas health
        timeout-minutes: 20
